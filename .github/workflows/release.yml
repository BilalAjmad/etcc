name: Build & Release All Platform Installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Direct Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Android APK Asset
        run: cp build/app/outputs/flutter-apk/app-release.apk local-ai-cam-android-installer.apk

      - name: Upload APK to Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: local-ai-cam-android-installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web-and-linux:
    name: Build Web & Linux Desktop Apps
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release

      - name: Package Web Asset
        run: cd build/web && zip -r ../../local-ai-cam-web.zip .

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux Asset
        run: cd build/linux/x64/release/bundle && zip -r ../../../../../local-ai-cam-linux.zip .

      - name: Upload Web & Linux to Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            local-ai-cam-web.zip
            local-ai-cam-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
